name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package sources
        working-directory: converter
        run: .\gradlew.bat test sourceRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: recover-world-via-voxy-source
          path: converter/build/distributions/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: converter/build/reports/tests/test
